[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimi-k3-mini"
version = "0.0.1"
description = "Research-oriented pure-PyTorch implementation of Kimi-K3 architectural mechanisms"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "numpy>=1.24"]

[project.optional-dependencies]
data = ["datasets>=2.18", "tokenizers>=0.15"]
dev = ["pytest>=8", "pyyaml>=6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -s"
markers = [
    "optional_dependency: tests requiring an optional external oracle",
]

[tool.setuptools.packages.find]
include = ["src*", "data*", "training*"]

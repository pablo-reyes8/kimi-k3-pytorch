# Memory-aware 16 GB T4 recipe: FP16, microbatch 1, accumulation, no EMA.
runtime:
  device: cuda
  total_steps: null
  verbose: true
  use_ema: false
  ema_decay: 0.999
  eval_use_ema: false
training:
  epochs: 3
  gradient_accumulation_steps: 32
  precision: fp16
  grad_clip_norm: 1.0
  use_mtp: true
  max_batches_per_epoch: null
  max_eval_batches: 64
  log_every_steps: 10
  eval_every_epochs: 1
  checkpoint_every_epochs: 1
  prediction_every_epochs: 1
  seed: 1337
  deterministic: false
  max_seq_len: 1024
loss:
  ignore_index: -100
  label_smoothing: 0.0
  mtp_loss_weight: 0.1
optimizer:
  kind: per_head_muon_adamw
  adamw_lr: 0.0003
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  muon_lr: 0.0003
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_ns_eps: 1.0e-7
  muon_update_rms_scaling: true
  weight_decay: 0.1
  per_head_qkv: true
  qk_clip_enabled: true
  qk_clip_threshold: 100.0
  qk_clip_every_steps: 1
scheduler:
  kind: cosine
  warmup_ratio: 0.01
  warmup_steps: null
  min_lr_ratio: 0.1
diagnostics:
  enabled: true
  cheap_every_steps: 1
  standard_every_steps: 50
  deep_every_steps: 1000
  sample_layers_per_standard_step: 2
  sample_tokens_per_layer: 64
  sample_parameters_per_group: 4
  sample_elements_per_parameter: 64
  max_diagnostic_time_fraction: 0.03
  max_persistent_gpu_bytes: 4194304
  alert_patience_steps: 5
context_curriculum:
  enabled: false
checkpoint:
  output_dir: checkpoints/t4_wikitext_213m
  run_name: kimi_k3_t4_wikitext_213m
  keep_last_n: 3
  save_optimizer: true
  save_rng_state: true
  atomic_write: true
  resume_from: null
prediction:
  sample_index: 0
  max_tokens: 32

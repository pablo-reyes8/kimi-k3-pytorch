# Full Kimi K3 topology. Validate as metadata; do not instantiate casually.
model:
  name: kimi_k3_canonical
  architecture: kimi_k3
  vocab_size: 160000
  d_model: 7168
  num_heads: 56
  num_hybrid_groups: 23
  attention_pattern: [kda, kda, kda, gated_mla]
  add_final_gated_mla: true
  pad_token_id: 0
  bos_token_id: 1
  eos_token_id: 2
  image_token_id: 3
  video_token_id: 4
  tie_word_embeddings: true
  initializer_range: 0.02
  kda:
    key_head_dim: 128
    short_conv_kernel_size: 4
    chunk_size: 64
    secondary_tile_size: 16
    accumulate_state_in_fp32: true
  mla:
    q_head_dim: 128
    kv_latent_dim: 3584
    attention_backend: auto
    keep_attention_output_fp32: true
  moe:
    latent_dim: 3584
    num_shared_experts: 2
    num_routed_experts: 896
    routed_experts_per_token: 16
    shared_expert_hidden_dim: 3072
    routed_expert_hidden_dim: 3072
    beta_gate: 4.0
    beta_up: 25.0
    routing_backend: vectorized
    quantile_backend: histogram
    enable_quantile_balancing: true
  attention_residual:
    mode: block
    transformer_layers_per_depth_block: 12
    sublayers_per_depth_block: 24
    target_num_depth_blocks: 8
    backend: two_phase
  vision:
    enabled: true
    type: moonvit
    image_size: 224
    patch_size: 14
    embed_dim: 1152
    depth: 27
    num_heads: 16
    use_cls_token: false
    use_pixel_shuffle: true
    projector:
      hidden_dim: 7168
  mtp:
    enabled: true
    num_mtp_layers: 1
    future_offset: 2
    loss_weight: 0.1
    attention_residual:
      mode: block
      sublayers_per_depth_block: 8
      target_num_depth_blocks: 1
      backend: two_phase

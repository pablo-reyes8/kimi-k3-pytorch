# Canonical training control plane. This validates as configuration metadata,
# but the full architecture requires an external distributed execution strategy
# that is intentionally outside the current single-process orchestrator.
runtime:
  device: cuda
  total_steps: 1000000
  verbose: true
  use_ema: true
  ema_decay: 0.999
  eval_use_ema: true
training:
  epochs: 100
  gradient_accumulation_steps: 1
  precision: bf16
  grad_clip_norm: 1.0
  use_mtp: true
  max_batches_per_epoch: null
  max_eval_batches: 64
  log_every_steps: 10
  eval_every_epochs: 1
  checkpoint_every_epochs: 1
  prediction_every_epochs: 1
  seed: 1337
  deterministic: false
  max_seq_len: 8192
loss:
  ignore_index: -100
  label_smoothing: 0.0
  mtp_loss_weight: 0.1
optimizer:
  kind: per_head_muon_adamw
  adamw_lr: 0.0003
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  muon_lr: 0.0003
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_ns_eps: 1.0e-7
  muon_update_rms_scaling: true
  weight_decay: 0.1
  per_head_qkv: true
  qk_clip_enabled: true
  qk_clip_threshold: 100.0
  qk_clip_every_steps: 1
scheduler:
  kind: cosine
  warmup_ratio: 0.01
  warmup_steps: null
  min_lr_ratio: 0.1
diagnostics:
  enabled: true
  cheap_every_steps: 1
  standard_every_steps: 10
  deep_every_steps: 500
  sample_layers_per_standard_step: 8
  rotate_sampled_layers: true
  sample_tokens_per_layer: 256
  sample_parameters_per_group: 16
  sample_elements_per_parameter: 256
  max_diagnostic_time_fraction: 0.05
  max_persistent_gpu_bytes: 16777216
  alert_patience_steps: 5
context_curriculum:
  enabled: true
  stages:
    - {max_seq_len: 512, until_tokens: 20000000}
    - {max_seq_len: 1024, until_tokens: 40000000}
    - {max_seq_len: 2048, until_tokens: 60000000}
    - {max_seq_len: 4096, until_tokens: 80000000}
    - {max_seq_len: 8192, until_tokens: null}
  transition_unit: tokens
  reset_dataloader_on_transition: true
  preserve_optimizer_state: true
  preserve_scheduler_state: true
checkpoint:
  output_dir: checkpoints/canonical
  run_name: kimi_k3_canonical
  keep_last_n: 3
  save_optimizer: true
  save_rng_state: true
  atomic_write: true
  resume_from: null
prediction:
  sample_index: 0
  max_tokens: 32

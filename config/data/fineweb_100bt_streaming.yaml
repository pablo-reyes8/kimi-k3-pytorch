# Source-scale preset. The remote sample is about 100B GPT-2 tokens; only the
# configured document caps are materialized locally.
data:
  name: fineweb_100bt_streaming
  kind: hf_text
  dataset:
    preset_name: fineweb_100bt
    block_size: 4096
    tokenizer_path: data/cache/tokenizers/fineweb_100bt_64000.json
    vocab_size: 64000
    min_frequency: 2
    max_tokenizer_documents: 100000
    max_train_documents: 250000
    max_validation_documents: null
    streaming: true
  loader:
    batch_size: 1
    validation_batch_size: 1
    num_workers: 8
    shuffle_train: true
    pin_memory: auto
    persistent_workers: true
    prefetch_factor: 2
    drop_last: true
    seed: 42

context_curriculum:
  enabled: true
  stages:
    - max_seq_len: 512
      until_tokens: 20000000
    - max_seq_len: 1024
      until_tokens: 40000000
    - max_seq_len: 2048
      until_tokens: 60000000
    - max_seq_len: 4096
      until_tokens: 80000000
    - max_seq_len: 8192
      until_tokens: null
  transition_unit: tokens
  reset_dataloader_on_transition: true
  preserve_optimizer_state: true
  preserve_scheduler_state: true

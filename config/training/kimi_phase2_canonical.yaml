training:
  device: auto
  precision: bf16
  gradient_accumulation_steps: 1
  grad_clip_norm: 1.0
  log_every_steps: 1

optimizer:
  kind: per_head_muon_adamw
  adamw_lr: 0.0003
  adamw_betas: [0.9, 0.95]
  adamw_eps: 1.0e-8
  muon_lr: null
  muon_momentum: 0.95
  muon_nesterov: true
  muon_ns_steps: 5
  muon_ns_eps: 1.0e-7
  muon_update_rms_scaling: true
  weight_decay: 0.1
  muon_weight_decay: null
  per_head_qkv: true
  qk_clip_enabled: true
  qk_clip_threshold: 100.0
  qk_clip_every_steps: 1
  qk_clip_kda_experimental: false
  fail_on_unclassified_matrix: true

scheduler:
  kind: cosine
  warmup_ratio: 0.01
  min_lr_ratio: 0.1

diagnostics:
  enabled: true
  cheap_every_steps: 1
  standard_every_steps: 10
  deep_every_steps: 500
  sample_layers_per_standard_step: 8
  rotate_sampled_layers: true
  sample_tokens_per_layer: 256
  sample_parameters_per_group: 16
  sample_elements_per_parameter: 256
  max_diagnostic_time_fraction: 0.05
  max_persistent_gpu_bytes: 16777216
  alert_patience_steps: 5

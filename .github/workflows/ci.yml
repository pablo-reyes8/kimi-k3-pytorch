name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.filter.outputs.core }}
      config: ${{ steps.filter.outputs.config }}
      inference: ${{ steps.filter.outputs.inference }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select affected validation lanes
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            core:
              - 'src/**'
              - 'training/**'
              - 'data/**'
              - 'scripts/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'requirements.txt'
              - '!scripts/README.md'
              - '!scripts/train_kimi.py'
              - '!scripts/infer_kimi.py'
              - '!scripts/validate_data_config.py'
              - '!scripts/validate_model_config.py'
              - '!scripts/validate_distributed_config.py'
              - '!tests/configuration/**'
              - '!tests/inference/**'
            config:
              - 'config/**'
              - 'configuration/**'
              - 'scripts/train_kimi.py'
              - 'scripts/validate_data_config.py'
              - 'scripts/validate_model_config.py'
              - 'scripts/validate_distributed_config.py'
              - 'tests/configuration/**'
            inference:
              - 'inference/**'
              - 'scripts/infer_kimi.py'
              - 'config/inference/**'
              - 'config/kimi_full_pipeline/cpu_smoke/**'
              - 'tests/inference/**'
            docker:
              - 'Dockerfile'
              - 'docker-compose.yml'
              - '.dockerignore'
              - 'pyproject.toml'
              - 'requirements.txt'

  config-contracts:
    name: YAML and CLI contracts
    needs: changes
    if: needs.changes.outputs.config == 'true' && needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/configuration
      - name: Validate low-GPU and canonical profiles without allocation
        run: |
          python -m scripts.train_kimi \
            --profile config/kimi_full_pipeline/low_gpu \
            --validate-only
          python -m scripts.train_kimi \
            --profile config/kimi_full_pipeline/canonical \
            --validate-only
          python -m scripts.validate_distributed_config \
            --profile config/kimi_full_pipeline/distributed_tp_ep_4x_24gb

  inference:
    name: Native-cache inference
    needs: changes
    if: needs.changes.outputs.inference == 'true' && needs.changes.outputs.core != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest tests/inference

  full-cpu-suite:
    name: Full CPU suite
    needs: changes
    if: needs.changes.outputs.core == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev,data]"
      - name: Validate public orchestration before the suite
        run: |
          python -m scripts.train_kimi \
            --profile config/kimi_full_pipeline/cpu_smoke \
            --validate-only
      - run: python -m pytest --durations=20

  docker:
    name: Container smoke
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPU test image
        run: docker build --target test -t kimi-k3-mini:test .
      - name: Run focused tests in the image
        run: |
          docker run --rm kimi-k3-mini:test \
            python -m pytest tests/configuration tests/inference
